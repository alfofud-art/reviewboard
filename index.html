const SESSION_LOCAL_ONLY_KEYS = new Set([
  STORAGE_KEYS.currentUser,
  STORAGE_KEYS.adminAuthenticatedUser,
])

let remoteSaveTimer = null
let remoteSavePayload = null

const getLocalWorkspaceState = () => {
  const state = {}
  Object.values(STORAGE_KEYS).forEach((key) => {
    if (SESSION_LOCAL_ONLY_KEYS.has(key)) return
    try {
      const value = window.localStorage.getItem(key)
      if (value !== null) state[key] = JSON.parse(value)
    } catch {
      // 개별 키 파싱 실패 방지
    }
  })
  return state
}

const applyRemoteWorkspaceState = (state) => {
  if (!state || typeof state !== 'object') return
  Object.entries(state).forEach(([key, value]) => {
    if (SESSION_LOCAL_ONLY_KEYS.has(key)) return
    try {
      window.localStorage.setItem(key, JSON.stringify(value))
    } catch {
      // 저장공간 부족 시 무시
    }
  })
}

const saveWorkspaceToSupabase = async (state) => {
  if (!supabaseClient) return
  try {
    await supabaseClient
      .from('reviewboard_workspace_state')
      .upsert({
        id: WORKSPACE_ID,
        state,
        updated_at: new Date().toISOString(),
      })
  } catch (error) {
    console.warn('Supabase 저장 실패:', error)
  }
}

const queueWorkspaceSave = () => {
  if (!supabaseClient) return
  remoteSavePayload = getLocalWorkspaceState()
  window.clearTimeout(remoteSaveTimer)
  remoteSaveTimer = window.setTimeout(() => {
    saveWorkspaceToSupabase(remoteSavePayload)
  }, 700)
}

const loadWorkspaceFromSupabase = async () => {
  if (!supabaseClient) return false
  try {
    const { data, error } = await supabaseClient
      .from('reviewboard_workspace_state')
      .select('state')
      .eq('id', WORKSPACE_ID)
      .maybeSingle()

    if (error) {
      console.warn('Supabase 불러오기 실패:', error)
      return false
    }

    if (data?.state) {
      applyRemoteWorkspaceState(data.state)
      return true
    }

    await saveWorkspaceToSupabase(getLocalWorkspaceState())
    return false
  } catch (error) {
    console.warn('Supabase 연결 실패:', error)
    return false
  }
}


const subscribeWorkspaceRealtime = (onRemoteChange) => {
  if (!supabaseClient) return null

  return supabaseClient
    .channel('reviewboard-workspace-realtime')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'reviewboard_workspace_state',
        filter: `id=eq.${WORKSPACE_ID}`,
      },
      (payload) => {
        const nextState = payload.new?.state
        if (!nextState) return

        applyRemoteWorkspaceState(nextState)
        onRemoteChange?.()
      }
    )
    .subscribe()
}

const loadStorage = (key, fallback) => {
  try {
    const saved = window.localStorage.getItem(key)
    return saved ? JSON.parse(saved) : fallback
  } catch {
    return fallback
  }
}

const saveStorage = (key, value) => {
  try {
    const serialized = JSON.stringify(value)
    const previous = window.localStorage.getItem(key)
    if (previous === serialized) return
    window.localStorage.setItem(key, serialized)
    if (!SESSION_LOCAL_ONLY_KEYS.has(key)) queueWorkspaceSave()
  } catch {
    // 저장공간 부족 시 앱 중단 방지
  }
}


const ATTACHMENT_DB_NAME = 'reviewboard_attachment_files'
const ATTACHMENT_STORE_NAME = 'files'

const openAttachmentDB = () => new Promise((resolve, reject) => {
  if (!window.indexedDB) return resolve(null)
  const request = window.indexedDB.open(ATTACHMENT_DB_NAME, 1)
  request.onupgradeneeded = () => {
    const db = request.result
    if (!db.objectStoreNames.contains(ATTACHMENT_STORE_NAME)) db.createObjectStore(ATTACHMENT_STORE_NAME)
  }
  request.onsuccess = () => resolve(request.result)
  request.onerror = () => reject(request.error)
})

const saveAttachmentBlob = async (key, file) => {
  try {
    const db = await openAttachmentDB()
    if (!db || !key || !file) return false
    await new Promise((resolve, reject) => {
      const transaction = db.transaction(ATTACHMENT_STORE_NAME, 'readwrite')
      transaction.objectStore(ATTACHMENT_STORE_NAME).put(file, key)
      transaction.oncomplete = resolve
      transaction.onerror = () => reject(transaction.error)
    })
    db.close()
    return true
  } catch {
    return false
  }
}

const getAttachmentBlob = async (key) => {
  try {
    const db = await openAttachmentDB()
    if (!db || !key) return null
    const blob = await new Promise((resolve, reject) => {
      const transaction = db.transaction(ATTACHMENT_STORE_NAME, 'readonly')
      const request = transaction.objectStore(ATTACHMENT_STORE_NAME).get(key)
      request.onsuccess = () => resolve(request.result || null)
      request.onerror = () => reject(request.error)
    })
    db.close()
    return blob
  } catch {
    return null
  }
}

const deleteAttachmentBlob = async (key) => {
  try {
    const db = await openAttachmentDB()
    if (!db || !key) return false
    await new Promise((resolve, reject) => {
      const transaction = db.transaction(ATTACHMENT_STORE_NAME, 'readwrite')
      transaction.objectStore(ATTACHMENT_STORE_NAME).delete(key)
      transaction.oncomplete = resolve
      transaction.onerror = () => reject(transaction.error)
    })
    db.close()
    return true
  } catch {
    return false
  }
}

const normalizeProjects = (projects) => {
  if (!Array.isArray(projects)) return DEFAULT_PROJECTS
  return projects.map((project, index) => {
    const storedFiles = Array.isArray(project.storedFiles) ? project.storedFiles : []
    return {
      ...project,
      id: project.id || `${project.title || 'project'}-${index}`,
      storedFiles,
      files: storedFiles.filter((file) => !file.isDocument).length || project.files || 0,
      docs: storedFiles.filter((file) => file.isDocument).length || project.docs || 0,
    }
  })
}

    if (projectSortMode === 'priority') {
      const statusPriority = { '컨펌대기': 1, '수정요청': 2, '컨펌완료': 3 }
      return withOriginalOrder
        .sort((a, b) => {
          const todayA = a.project.deadline === todayString() ? 0 : 1
          const todayB = b.project.deadline === todayString() ? 0 : 1
          if (todayA !== todayB) return todayA - todayB
          const statusA = statusPriority[a.project.status] ?? 4
          const statusB = statusPriority[b.project.status] ?? 4
          if (statusA !== statusB) return statusA - statusB
          return getCreatedTime(b.project) - getCreatedTime(a.project) || a.index - b.index
        })
        .map((item) => item.project)
    }
    return withOriginalOrder
      .sort((a, b) => getCreatedTime(b.project) - getCreatedTime(a.project) || a.index - b.index)
      .map((item) => item.project)
  }, [activeMenu, projects, currentUser, searchKeyword, searchType, projectSortMode])

      const nextX = Math.max(0, Math.min(ANNOTATION_CANVAS_WIDTH, draggingComment.startX + ((event.clientX - draggingComment.startClientX) / rect.width) * ANNOTATION_CANVAS_WIDTH))
      const nextY = Math.max(0, Math.min(ANNOTATION_CANVAS_HEIGHT, draggingComment.startY + ((event.clientY - draggingComment.startClientY) / rect.height) * ANNOTATION_CANVAS_HEIGHT))
      setComments((prev) => ({

      }))
    }

    reader.readAsDataURL(file)
  })

  }

  const getImageSize = (url) => new Promise((resolve) => {
    if (!url) return resolve(null)
    const image = new Image()
    image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight })
    image.onerror = () => resolve(null)
    image.src = url
  })

    const dbKey = !isImage ? id : null
    if (!isImage) await saveAttachmentBlob(dbKey, file)
    const size = await getImageSize(imageUrl)
    return {
      id,

      name: file.name,
      type: file.type || 'application/octet-stream',

    if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / (60 * 60 * 1000))}시간 전`

  const saveCurrentView = (key = activeImageKey, next = {}) => {

    setIsDrawing(false)
    setIsPanning(false)
  }

  const applyViewState = (file, index) => {

    const saved = viewStates[key]
    setZoomLevel(saved?.zoomLevel || 100)
    setPan(saved?.pan || { x: 0, y: 0 })
    setActiveTool('')
    setPendingComment(null)
    setIsDrawing(false)
    setIsPanning(false)
  }

  const moveImage = (direction) => {
    if (visibleImages.length <= 1) return
    saveCurrentView()
    setCurrentImageIndex((prev) => {
      const nextIndex = Math.min(Math.max(prev + direction, 0), visibleImages.length - 1)
      applyViewState(visibleImages[nextIndex], nextIndex)
      return nextIndex
    })
  }

  const selectImageIndex = (index) => {

    setCurrentImageIndex(index)
    applyViewState(visibleImages[index], index)

  const zoomIn = () => {

  }

  const zoomOut = () => {

    saveCurrentView(activeImageKey, { zoomLevel: next, pan: nextPan })
  }

  const getCanvasPoint = (event) => {
    const imageLayer = event.currentTarget.querySelector('[data-image-layer="true"]')
    const rect = imageLayer?.getBoundingClientRect() || event.currentTarget.getBoundingClientRect()
    const ratioX = rect.width ? (event.clientX - rect.left) / rect.width : 0
    const ratioY = rect.height ? (event.clientY - rect.top) / rect.height : 0
    return {
      x: Math.max(0, Math.min(ANNOTATION_CANVAS_WIDTH, ratioX * ANNOTATION_CANVAS_WIDTH)),
      y: Math.max(0, Math.min(ANNOTATION_CANVAS_HEIGHT, ratioY * ANNOTATION_CANVAS_HEIGHT)),
    }
  }

  const getAnnotationPositionStyle = (point) => ({

    return {

  }

  }

  }

  const handleCanvasMouseDown = (event) => {
    if (!currentFile?.url) return
    if (activeTool === 'comment') {
      const point = getCanvasPoint(event)

      setPendingComment(point)
      setCommentText('')
      return
    }
    if (activeTool === 'eraser') {
      setDrawings((prev) => ({ ...prev, [activeImageKey]: (prev[activeImageKey] || []).slice(0, -1) }))

      return
    }
    if (['red', 'yellow', 'blue'].includes(activeTool)) {
      event.preventDefault()
      const point = getCanvasPoint(event)
      const path = { id: Date.now(), tool: activeTool, points: [point] }
      setActiveAnnotationKey(activeImageKey)
      setDrawings((prev) => ({ ...prev, [activeImageKey]: [...(prev[activeImageKey] || []), path] }))
      setIsDrawing(true)
      return
    }
    if ((activeTool === 'hand' || isSpacePressed) && zoomLevel > 100) {

    if (isPanning && dragStart) {

    if (!validImages.length) return setNotice('JPG 또는 PNG 시안을 미리보기 판에 드래그해주세요.')

  const registerQuickUploadProject = () => {

  const markRevisionCompleted = () => {
    if (!currentFile || currentKey === 'empty') return
    const nextValue = !revisionCompletedFiles[currentKey]
    setRevisionCompletedFiles((prev) => ({ ...prev, [currentKey]: nextValue }))
    setNotice(nextValue ? '현재 이미지가 수정없음 상태로 표시되었습니다.' : '현재 이미지의 수정없음 표시를 해제했습니다.')
  }

  const requestRevision = () => {
    if (!selectedProjectTitle || !currentFile) return
    const targetProject = projects.find((project) => project.title === selectedProjectTitle)
    if (!targetProject) return
    const sourceFiles = targetProject.storedFiles?.length ? targetProject.storedFiles : uploadedFiles
    const imageFiles = sourceFiles.filter((file) => !file.isDocument)
    const currentImage = currentFile
    const realCurrentIndex = imageFiles.findIndex((image) => image.id === currentImage?.id)
    const currentImageKey = getFileKey(currentImage, realCurrentIndex >= 0 ? realCurrentIndex : currentImageIndex)
    const isAlreadyRequested = Boolean(currentImage?.revisionRequested)

    const nextFiles = sourceFiles.map((file) => {
      if (file.isDocument) return file
      const fileIndex = imageFiles.findIndex((image) => image.id === file.id)
      const isCurrentFile = file.id === currentImage?.id || getFileKey(file, fileIndex) === currentImageKey
      return isCurrentFile ? { ...file, revisionRequested: !isAlreadyRequested, revisionRequestedAt: isAlreadyRequested ? null : Date.now() } : file
    })
    const requestedFiles = nextFiles.filter((file) => !file.isDocument && file.revisionRequested)
    const nextStatus = requestedFiles.length ? '수정요청' : '컨펌대기'
    setProjects((prev) => prev.map((project) => project.title === selectedProjectTitle ? { ...project, status: nextStatus, revisionBeforeFiles: requestedFiles, storedFiles: nextFiles, files: nextFiles.filter((file) => !file.isDocument).length, docs: nextFiles.filter((file) => file.isDocument).length } : project))
    setUploadedFiles(nextFiles)
    setCurrentImageIndex(0)
    addNotification(isAlreadyRequested ? '수정요청취소' : '수정요청', selectedProjectTitle)
    if (!isAlreadyRequested) {
      setRevisionCompletedFiles((prev) => {
        const next = { ...prev }
        delete next[currentImageKey]
        return next
      })
    }
    setNotice(isAlreadyRequested ? '수정요청이 취소되어 카드가 컨펌대기로 복귀했습니다.' : '현재 이미지를 수정요청 대상으로 표시했습니다. 수정없음은 자동 해제되었습니다.')
  }

  const applyRevisionUploadFiles = async (files) => {
    const targetProject = projects.find((project) => project.title === revisionUploadProjectTitle)
    if (!targetProject) return setNotice('수정본을 적용할 프로젝트를 찾을 수 없습니다.')
    const validImages = Array.from(files || []).filter(isAllowedImageFile)
    if (!validImages.length) return setNotice('JPG 또는 PNG 수정본을 업로드해주세요.')
    const uploaded = await mapFiles(validImages)
    const docs = (targetProject.storedFiles || []).filter((file) => file.isDocument)
    const existingImages = (targetProject.storedFiles || []).filter((file) => !file.isDocument)
    const requestedBeforeFiles = targetProject.revisionBeforeFiles?.length ? targetProject.revisionBeforeFiles : existingImages.filter((file) => file.revisionRequested)
    const beforeFiles = requestedBeforeFiles.length ? requestedBeforeFiles : existingImages
    const nextImages = uploaded.map((file, index) => {
      const before = beforeFiles[index]
      return before ? { ...file, beforeFile: before, beforeUrl: before.url, beforeName: before.name } : file
    })
    const nextFiles = [...nextImages, ...docs]
    setProjects((prev) => prev.map((project) => project.title === targetProject.title ? { ...project, status: '컨펌대기', revisionBeforeFiles: [], storedFiles: nextFiles, files: nextImages.length, docs: docs.length } : project))
    setSelectedProjectTitle(targetProject.title)
    setSelectedCardTitle(targetProject.title)
    setUploadedFiles(nextFiles)
    setCurrentImageIndex(0)
    setRevisionUploadProjectTitle(null)
    addNotification('수정본업로드', targetProject.title)
    setNotice(`수정본이 업로드되어 컨펌대기로 변경되었습니다. ${Math.min(nextImages.length, beforeFiles.length)}개 이미지가 BEFORE/AFTER로 연결되었습니다.`)
  }

  const downloadCurrentReviewImage = async () => {
    try {
      if (!activeImageUrl) return setNotice('다운로드할 이미지가 없습니다.')

      const drawRoundedRect = (ctx, x, y, width, height, radius) => {
        const r = Math.min(radius, width / 2, height / 2)
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.lineTo(x + width - r, y)
        ctx.quadraticCurveTo(x + width, y, x + width, y + r)
        ctx.lineTo(x + width, y + height - r)
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height)
        ctx.lineTo(x + r, y + height)
        ctx.quadraticCurveTo(x, y + height, x, y + height - r)
        ctx.lineTo(x, y + r)
        ctx.quadraticCurveTo(x, y, x + r, y)
        ctx.closePath()
      }

      const image = new Image()
      const loadedImage = await new Promise((resolve, reject) => {
        image.onload = () => resolve(image)
        image.onerror = reject
        image.src = activeImageUrl
      }).catch(() => null)

      if (!loadedImage) return setNotice('이미지를 불러오지 못해 다운로드할 수 없습니다.')

      const canvas = document.createElement('canvas')
      canvas.width = ANNOTATION_CANVAS_WIDTH
      canvas.height = ANNOTATION_CANVAS_HEIGHT
      const ctx = canvas.getContext('2d')
      if (!ctx) return setNotice('다운로드 이미지를 만들 수 없습니다.')

      ctx.fillStyle = '#334155'
      ctx.fillRect(0, 0, canvas.width, canvas.height)

      const imageRatio = loadedImage.naturalWidth / loadedImage.naturalHeight
      const canvasRatio = canvas.width / canvas.height
      let drawWidth = canvas.width
      let drawHeight = canvas.height
      if (imageRatio > canvasRatio) {
        drawHeight = canvas.width / imageRatio
      } else {
        drawWidth = canvas.height * imageRatio
      }
      const drawX = (canvas.width - drawWidth) / 2
      const drawY = (canvas.height - drawHeight) / 2
      ctx.drawImage(loadedImage, drawX, drawY, drawWidth, drawHeight)

      currentDrawings.forEach((path) => {
        if (!path.points?.length) return
        const style = getToolStyle(path.tool)
        ctx.beginPath()
        path.points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y)
          else ctx.lineTo(point.x, point.y)
        })
        ctx.strokeStyle = style.stroke
        ctx.lineWidth = style.width
        ctx.globalAlpha = style.opacity
        ctx.lineCap = 'round'
        ctx.lineJoin = 'round'
        ctx.stroke()
        ctx.globalAlpha = 1
      })

      currentComments.forEach((comment, index) => {
        const markerX = Math.max(18, Math.min(comment.x, canvas.width - 18))
        const markerY = Math.max(18, Math.min(comment.y, canvas.height - 18))
        const x = Math.max(12, Math.min(markerX + 12, canvas.width - 272))
        const y = Math.max(12, Math.min(markerY + 12, canvas.height - 110))

        ctx.fillStyle = '#4F7CFF'
        ctx.beginPath()
        ctx.arc(markerX, markerY, 15, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#FFFFFF'
        ctx.font = 'bold 14px sans-serif'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText(String(index + 1), markerX, markerY)

        drawRoundedRect(ctx, x, y, 260, 86, 16)
        ctx.fillStyle = 'rgba(30, 41, 59, 0.96)'
        ctx.fill()
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'
        ctx.lineWidth = 1
        ctx.stroke()

        ctx.fillStyle = '#FFFFFF'
        ctx.font = 'bold 13px sans-serif'
        ctx.textAlign = 'left'
        ctx.textBaseline = 'top'
        ctx.fillText(comment.name || currentUser, x + 14, y + 12)

        ctx.fillStyle = 'rgba(255,255,255,0.86)'
        ctx.font = '13px sans-serif'
        const text = comment.text || ''
        const lines = text.match(/.{1,24}/g) || ['']
        lines.slice(0, 3).forEach((line, lineIndex) => ctx.fillText(line, x + 14, y + 36 + lineIndex * 16))
      })

      const fileName = `${(activeImageName || 'review-image').replace(/\.[^/.]+$/, '')}_review.png`
      const triggerDownload = (url) => {
        const link = document.createElement('a')
        link.href = url
        link.download = fileName
        link.target = '_blank'
        link.rel = 'noopener noreferrer'
        document.body.appendChild(link)
        link.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }))
        document.body.removeChild(link)
      }

      if (canvas.toBlob) {
        canvas.toBlob((blob) => {
          if (!blob) {
            const dataUrl = canvas.toDataURL('image/png')
            triggerDownload(dataUrl)
            setNotice('다운로드를 시도했습니다. 목록에 없으면 새 탭에서 이미지를 저장해주세요.')
            return
          }
          const blobUrl = URL.createObjectURL(blob)
          triggerDownload(blobUrl)
          setTimeout(() => URL.revokeObjectURL(blobUrl), 8000)
          setNotice('다운로드를 시도했습니다. 다운로드 목록에 없으면 브라우저가 자동 저장을 차단한 상태입니다.')
        }, 'image/png')
      } else {
        const dataUrl = canvas.toDataURL('image/png')
        triggerDownload(dataUrl)
        setNotice('다운로드를 시도했습니다. 목록에 없으면 브라우저 다운로드 설정을 확인해주세요.')
      }
    } catch (error) {
      setNotice('다운로드 중 오류가 발생했습니다. 이미지를 다시 업로드한 뒤 시도해주세요.')
    }
  }

  const dataUrlToBlob = (dataUrl) => {
    if (!dataUrl || !dataUrl.startsWith('data:')) return null
    const [header, data] = dataUrl.split(',')
    if (!data) return null
    const mimeMatch = header.match(/data:([^;]+)/)
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream'
    const isBase64 = header.includes(';base64')
    const binary = isBase64 ? atob(data) : decodeURIComponent(data)
    const length = binary.length
    const bytes = new Uint8Array(length)
    for (let i = 0; i < length; i += 1) bytes[i] = binary.charCodeAt(i)
    return new Blob([bytes], { type: mime })
  }

  const downloadAttachment = async (file) => {
    if (!file) return
    const fileName = file.name || 'attachment'
    const sourceBlob = file.rawFile instanceof Blob
      ? file.rawFile
      : file.url?.startsWith('data:')
        ? dataUrlToBlob(file.url)
        : await getAttachmentBlob(file.dbKey || file.id)
    if (!sourceBlob) return
    const downloadUrl = URL.createObjectURL(sourceBlob)
    const link = document.createElement('a')
    link.href = downloadUrl
    link.download = fileName
    link.style.display = 'none'
    document.body.appendChild(link)
    link.click()
    document.body.removeChild(link)
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 15000)
  }

                {renderImageCanvas(false)}
                {quickUploadDraft && <div className="mx-auto mt-3 flex w-[1160px] max-w-[calc(100vw-560px)] flex-wrap items-center justify-center gap-3 rounded-2xl border border-[#4F7CFF]/25 bg-[#4F7CFF]/10 px-4 py-3 text-xs text-slate-200"><span className="font-medium text-white">{quickUploadDraft.title}</span><span className="text-slate-400">작업자</span><select value={currentUser} onChange={(event) => setCurrentUser(event.target.value)} className="rounded-xl border border-white/10 bg-[#0F172A] px-3 py-2 text-xs text-white outline-none">{teamMembers.map((member) => <option key={member} value={member}>{member}</option>)}</select><span className="text-slate-400">컨펌자</span><select value={quickUploadReviewer} onChange={(event) => setQuickUploadReviewer(event.target.value)} className="rounded-xl border border-white/10 bg-[#0F172A] px-3 py-2 text-xs text-white outline-none">{teamMembers.map((member) => <option key={member} value={member}>{member}</option>)}</select><label className="flex cursor-pointer items-center gap-2 rounded-xl border border-red-400/25 bg-red-500/10 px-3 py-2 text-xs font-medium text-red-100"><input type="checkbox" checked={quickUploadTodayDeadline} onChange={(event) => setQuickUploadTodayDeadline(event.target.checked)} className="sr-only" /><span className={`flex h-5 w-5 items-center justify-center rounded-md border transition ${quickUploadTodayDeadline ? 'border-red-300 bg-red-500/70 text-white' : 'border-white/20 bg-white/[0.06] text-transparent'}`}>✓</span><span>오늘 마감</span></label><button type="button" onClick={registerQuickUploadProject} className="rounded-xl bg-[#4F7CFF] px-4 py-2 text-xs font-medium text-white hover:bg-[#3B68EB]">등록</button><button type="button" onClick={() => { setQuickUploadDraft(null); setQuickUploadTodayDeadline(false); setUploadedFiles([]); setCurrentImageIndex(0) }} className="rounded-xl border border-white/10 bg-white/[0.06] px-4 py-2 text-xs text-white/70 hover:bg-white/[0.1]">취소</button></div>}
                {visibleImages.length > 0 && <div className="mx-auto mt-3 w-[1160px] max-w-[calc(100vw-560px)] rounded-xl border border-white/10 bg-black/20 px-4 py-4 text-center text-xs text-slate-300"><div className="flex min-h-[22px] items-center justify-center gap-2"><p className="truncate">{currentImageIndex + 1} / {visibleImages.length} · {currentFile?.name}</p><span className={`min-w-[58px] rounded-full border border-emerald-400/30 bg-emerald-500/15 px-2 py-0.5 text-[10px] font-medium text-emerald-200 ${revisionCompletedFiles[currentKey] ? 'opacity-100' : 'opacity-0'}`}>수정없음</span></div><p className="mt-1 text-slate-400">{currentFile?.width && currentFile?.height ? `${currentFile.width}×${currentFile.height}px` : '해상도 미확인'} · {formatFileSize(currentFile?.size)}</p>{visibleImages.length > 1 && <div className="mt-2 flex flex-wrap justify-center gap-1.5">{visibleImages.map((file, index) => { const fileKey = getFileKey(file, index); const isDone = revisionCompletedFiles[fileKey]; return <button key={fileKey} type="button" onClick={() => selectImageIndex(index)} className={`min-w-[28px] rounded-full border px-2 py-1 text-[10px] font-medium ${index === currentImageIndex ? 'border-[#4F7CFF]/60 bg-[#4F7CFF]/20 text-[#BFDBFE]' : isDone ? 'border-emerald-400/30 bg-emerald-500/15 text-emerald-200' : file.revisionRequested ? 'border-amber-400/35 bg-amber-500/15 text-amber-200' : 'border-white/10 bg-white/[0.04] text-slate-400'}`}>{index + 1}{file.revisionRequested ? ' !' : isDone ? ' ✓' : ''}</button> })}</div>}{uploadedDocs.length > 0 && <div className="mt-3 border-t border-white/10 pt-3"><p className="mb-2 text-[11px] font-medium text-slate-400">첨부 문서</p><div className="flex flex-wrap justify-center gap-2">{uploadedDocs.map((file) => <div key={file.id || file.name} className="group/doc flex max-w-[260px] items-center overflow-hidden rounded-full border border-white/10 bg-white/[0.06] text-[11px] text-[#BFDBFE] hover:border-[#4F7CFF]/50 hover:bg-[#4F7CFF]/10"><button type="button" onClick={() => downloadAttachment(file)} className="min-w-0 flex-1 truncate px-3 py-1.5 text-left">📎 {file.name}</button>{canDeleteSelectedProject && <button type="button" onClick={(event) => { event.stopPropagation(); deleteAttachment(file) }} className="mr-1 flex h-6 w-6 items-center justify-center rounded-full text-white/45 hover:bg-red-500/20 hover:text-red-200">×</button>}</div>)}</div></div>}</div>}
                {!isFullscreenPreviewOpen && <><button type="button" onMouseDown={(event) => event.stopPropagation()} onClick={(event) => { event.stopPropagation(); moveImage(-1) }} className="preview-canvas-side-arrow absolute left-4 z-[45] h-12 w-12 -translate-y-1/2 rounded-full border border-white/10 bg-black/50 hover:border-[#4F7CFF]">←</button><button type="button" onMouseDown={(event) => event.stopPropagation()} onClick={(event) => { event.stopPropagation(); moveImage(1) }} className="preview-canvas-side-arrow absolute right-4 z-[45] h-12 w-12 -translate-y-1/2 rounded-full border border-white/10 bg-black/50 hover:border-[#4F7CFF]">→</button></>}
              </div>
            </div>
          </section>}
        </div>
      </main>
    </div>
  )
}


const root = ReactDOM.createRoot(document.getElementById('root'))
root.render(<DesignReviewPlatform />)

  </script>
</body>
</html>
